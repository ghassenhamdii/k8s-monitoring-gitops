apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.4
      helm:
        valueFiles:
          - $values/monitoring/values.yaml

    - repoURL: https://github.com/ghassenhamdii/k8s-monitoring-gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/ghassenhamdii/k8s-monitoring-gitops.git
      targetRevision: main
      path: manifests

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
